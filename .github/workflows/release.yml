name: Release

# Sources:
# https://docs.astral.sh/uv/guides/integration/github/
# https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
# https://cli.github.com/manual/gh_release_create

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked

      - name: Run complete release gate
        run: uv run python scripts/check.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "TarpScout $GITHUB_REF_NAME"
          --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          dist/*
